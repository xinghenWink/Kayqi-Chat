name: kayqi-chat

services:
  app:
    # 从本仓库的 GitHub Actions/GHCR 拉取预先构建好的 Kayqi 镜像。
    # 首次部署前先确认 Actions 的 Image 工作流构建成功。
    image: ghcr.io/xinghenwink/kayqi-chat:dev-kayqi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./kayqi-data:/app/data
      - ./kayqi-storage:/app/storage
    stop_grace_period: 90s
