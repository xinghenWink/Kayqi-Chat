name: kayqi-chat

services:
  app:
    # 构建本地开发代码，避免误用尚未包含积分功能的上游镜像。
    build:
      context: ..
      dockerfile: Dockerfile
    image: kayqi-chat:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./kayqi-data:/app/data
      - ./kayqi-storage:/app/storage
    stop_grace_period: 90s
